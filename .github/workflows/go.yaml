name: Go

on:
  push:
    branches: [ main, release-4.12, release-4.13, release-4.14, release-5.1 ]
  pull_request:
    branches: [ main, release-4.12, release-4.13, release-4.14, release-5.1 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.5'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
